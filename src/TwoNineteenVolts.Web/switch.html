/* ===========================================================================
   The hall's own screen theme, lifted from the control panel so this page and
   the counter monitor read as one product.
   =========================================================================== */
:root{
  --scr-bg:      #0b1510;
  --scr-card:    #12211a;
  --scr-line:    rgba(255,255,255,.07);
  --scr-ink:     #f3ead8;
  --scr-soft:    #93a69a;

  --accent:      #2f72a9;   /* blue cue chalk: the one accent */
  --accent-dark: #245d8c;
  --accent-lit:  #3a80bb;
  --accent-ink:  #ffffff;

  --switch-on:   #2fa56b;
  --switch-off:  #2a3a31;

  --free:        #8fb8a0;   /* off: pale felt */
  --live:        #3fbf7f;   /* on: money is flowing */
  --warn:        #f2a93b;   /* last 30% of the timer */
  --dead:        #e0563f;   /* offline, or the relay refused */

  --r:           3px;
  --ease:        cubic-bezier(.33,0,.5,1);
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0; background:#101010; color:var(--scr-ink);
  font-family:"Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  font-size:16px; line-height:1.45; -webkit-font-smoothing:antialiased;
  display:grid; place-items:center;
  padding:max(16px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-left,0px));
}
.vh{ position:absolute!important; width:1px; height:1px; margin:-1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
:where(button,input):focus-visible{ outline:2px solid var(--scr-ink); outline-offset:2px; }
[hidden]{ display:none!important; }

/* the screen surface the card sits on */
.screen{
  width:100%; max-width:360px; background:var(--scr-bg);
  border:1px solid var(--scr-line); border-radius:var(--r);
  padding:10px 12px 12px; display:flex; flex-direction:column; gap:8px;
}
.panel-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; }
.tbl{ margin:0; font-size:14px; font-weight:600; line-height:1.2; white-space:nowrap; }
.tbl small{ font-size:11px; font-weight:400; color:var(--scr-soft); letter-spacing:.02em; }
.stats{ margin:0; font-size:11px; color:var(--scr-soft); white-space:nowrap; }

/* ---- the station card, the same one the counter monitor shows ----------- */
.station{
  --state:var(--free);
  display:flex; flex-direction:column; align-items:center; gap:8px;
  padding:12px; border-radius:var(--r);
  background:var(--scr-card); border:1px solid var(--scr-line);
}
.station[data-mode="PLAYING"]    { --state:var(--live); }
.station[data-mode="PLAYING"].low{ --state:var(--warn); }
.station[data-mode="DEAD"]       { --state:var(--dead); }

.st-head{ align-self:stretch; display:flex; align-items:center; justify-content:space-between; gap:6px; }
.st-name{ margin:0; min-width:0; font-size:13px; font-weight:600; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* light switch — the one control that is always available */
.toggle{
  display:inline-flex; align-items:center; gap:8px; flex:none;
  font:inherit; font-size:12.5px; color:var(--scr-soft);
  background:none; border:0; padding:3px 1px; cursor:pointer;
}
.track{
  position:relative; width:32px; height:18px; flex:none; border-radius:9px;
  background:var(--switch-off); transition:background 200ms var(--ease);
}
.track::after{
  content:""; position:absolute; top:3px; left:3px; width:12px; height:12px; border-radius:50%;
  background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.3);
  transition:transform 200ms var(--ease);
}
.toggle[aria-checked="true"]{ color:var(--scr-ink); }
.toggle[aria-checked="true"] .track{ background:var(--switch-on); }
.toggle[aria-checked="true"] .track::after{ transform:translateX(14px); }
.toggle:disabled{ opacity:.5; cursor:wait; }

/* ---- countdown: a dial that drains, in the colour of the state ---------- */
.dial{ position:relative; flex:none; width:clamp(118px,42vw,150px); aspect-ratio:1; display:grid; place-items:center; }
.ring{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
.ring circle{ fill:none; stroke-width:6; }
.ring .rail{ stroke:rgba(255,255,255,.08); }
.ring .arc{
  stroke:var(--state);
  stroke-dasharray:326.73; stroke-dashoffset:0;      /* 2·π·52 */
  transition:stroke-dashoffset 300ms linear;
}
.clock{
  position:relative; margin:0; font-weight:400;
  font-size:clamp(24px,8vw,30px); line-height:1; letter-spacing:.01em; color:var(--scr-ink);
}
.st-status{
  margin:0; display:inline-flex; align-items:center; gap:6px;
  font-size:11px; color:var(--state); white-space:nowrap;
}
.st-status .dot{ width:7px; height:7px; flex:none; border-radius:1px; background:var(--state); }

/* ---- how long Start runs, in seconds so a demo can be a few of them ----- */
.secs{ align-self:stretch; display:flex; align-items:center; justify-content:space-between; gap:10px; }
.secs label{ font-size:11px; color:var(--scr-soft); white-space:nowrap; }
input{
  font:inherit; font-size:15px; color:var(--scr-ink); background:var(--scr-bg);
  border:1px solid var(--scr-line); border-radius:var(--r); padding:7px 9px;
  width:100%; min-width:0;
}
.secs input{ width:92px; text-align:right; }

/* one button: Start, in the hall's only accent */
.start{
  align-self:stretch; font:inherit; font-size:13px; font-weight:600; white-space:nowrap;
  padding:9px 10px; color:var(--accent-ink); background:var(--accent);
  border:1px solid var(--accent-dark); border-radius:var(--r);
  cursor:pointer; transition:background 120ms var(--ease);
}
.start:hover{ background:var(--accent-lit); }
.start:active{ background:var(--accent-dark); }
.start:disabled{ opacity:.5; cursor:wait; }

.msg{ min-height:1.35em; margin:0; font-size:11px; color:var(--scr-soft); text-align:center; }
.foot{ margin:0; font-size:10px; color:var(--scr-soft); text-align:center; letter-spacing:.04em; }
button.link{
  font:inherit; font-size:10px; letter-spacing:.04em; color:var(--scr-soft);
  border:0; padding:0; background:none; text-decoration:underline; cursor:pointer;
}
button.link:hover{ color:var(--scr-ink); }

/* ---- setup: the same surface, with fields ------------------------------- */
.setup{ display:grid; gap:14px; padding:12px; border-radius:var(--r); background:var(--scr-card); border:1px solid var(--scr-line); }
.lead{ margin:0; font-size:12px; line-height:1.5; color:var(--scr-soft); }
.field{ display:grid; gap:6px; }
.field label{ font-size:11px; color:var(--scr-soft); letter-spacing:.04em; }
.err{ min-height:1.35em; margin:0; font-size:11px; color:var(--dead); }

@media (prefers-reduced-motion:reduce){ *{ transition-duration:0ms!important; } }
</style>
</head>
<body>

<main class="screen">
  <header class="panel-head">
    <h1 class="tbl">219 Watts <small>switch</small></h1>
    <p class="stats">CH 0</p>
  </header>

  <section id="step-key" class="setup" hidden>
    <p class="lead">Enter the API key for this hall's control panel.</p>
    <form class="field" id="key-form">
      <label for="key-input">API key</label>
      <input id="key-input" type="password" autocomplete="off" spellcheck="false" required>
      <p class="err" id="key-err"></p>
      <button class="start" type="submit">Continue</button>
    </form>
  </section>

  <section id="step-device" class="setup" hidden>
    <p class="lead">Name the device, then give its Shelly ID. The ID is checked against the hall's Shelly account before it is saved.</p>
    <form id="device-form" style="display:grid; gap:12px;">
      <div class="field">
        <label for="name-input">Name</label>
        <input id="name-input" type="text" placeholder="Table light" autocomplete="off" required>
      </div>
      <div class="field">
        <label for="id-input">Device ID</label>
        <input id="id-input" type="text" placeholder="e4b06371d5e8" autocomplete="off" spellcheck="false" required>
      </div>
      <p class="err" id="device-err"></p>
      <button class="start" id="connect" type="submit">Connect</button>
    </form>
  </section>

  <section id="step-switch" hidden>
    <article class="station" id="card" data-mode="IDLE">
      <div class="st-head">
        <h2 class="st-name" id="name">Device</h2>
        <button class="toggle" id="toggle" type="button" role="switch" aria-checked="false" aria-label="Power">
          <span class="track" aria-hidden="true"></span>
        </button>
      </div>

      <div class="dial">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
          <circle class="rail" cx="60" cy="60" r="52"/>
          <circle class="arc" id="arc" cx="60" cy="60" r="52"/>
        </svg>
        <p class="clock" id="clock" role="timer">00:00</p>
      </div>

      <p class="st-status"><span class="dot" aria-hidden="true"></span><span id="word">Checking…</span></p>

      <div class="secs">
        <label for="seconds">Run for (seconds)</label>
        <input id="seconds" type="number" min="1" max="86400" step="1" inputmode="numeric" value="60">
      </div>

      <button class="start" id="start" type="button">Start</button>
    </article>
    <p class="msg" id="msg" role="status"></p>
    <p class="foot"><span id="device-id"></span> · <button class="link" id="change" type="button">Change device</button></p>
  </section>
</main>

<script>
  const API_KEY_STORAGE = "219wats.apiKey";   // the same key the control panel stores, so one setup covers both
  const DEVICE_STORAGE  = "219wats.switch";
  const SECONDS_STORAGE = "219wats.switchSeconds";
  const ARC = 326.73;                         // 2·π·52, matching stroke-dasharray in the CSS
  const LOW = 0.3;                            // below this share left, the dial turns lamp-amber

  const $ = id => document.getElementById(id);
  const say = text => { $("msg").textContent = text; };

  function read(key){ try { return localStorage.getItem(key); } catch { return null; } }
  function write(key, value){ try { localStorage.setItem(key, value); } catch {} }
  function forget(key){ try { localStorage.removeItem(key); } catch {} }

  function savedDevice(){
    const raw = read(DEVICE_STORAGE);
    if (!raw) return null;
    try { return JSON.parse(raw); } catch { return null; }
  }

  let device = null;

  /* ---- the API ----------------------------------------------------------- */

  /** Calls the API; resolves with the JSON body (or null), rejects with the ProblemDetails title. */
  async function callApi(method, path, body){
    const headers = { "X-Api-Key": read(API_KEY_STORAGE) || "" };
    if (body) headers["Content-Type"] = "application/json";

    // Relative, so the page keeps working under the server's /219wats/ path.
    const res = await fetch("api/devices" + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
    if (res.status === 401) forget(API_KEY_STORAGE);
    if (!res.ok){
      const problem = await res.json().catch(() => ({}));
      const error = new Error(problem.title || ("HTTP " + res.status));
      error.status = res.status;
      throw error;
    }
    return res.status === 204 ? null : res.json();
  }

  function messageFor(error){
    if (error.status === 401) return "That API key was rejected.";
    if (error.status === 502) return "Shelly Cloud is not answering. Try again.";
    if (!error.status)        return "No connection to the server.";
    return error.message;     // 404 carries the reason: unknown device, or not registered
  }

  /* ---- the three steps --------------------------------------------------- */

  function show(step){
    for (const id of ["key", "device", "switch"]){
      $("step-" + id).hidden = id !== step;
    }
  }

  function askForKey(message){
    $("key-err").textContent = message || "";
    $("key-input").value = "";
    show("key");
    $("key-input").focus();
  }

  $("key-form").addEventListener("submit", (event) => {
    event.preventDefault();
    const key = $("key-input").value.trim();
    if (!key) return;
    write(API_KEY_STORAGE, key);
    // The key is only proven once a call uses it, so the next step is where a wrong one surfaces.
    device ? openSwitch() : show("device");
  });

  $("device-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const name = $("name-input").value.trim();
    const deviceId = $("id-input").value.trim();
    if (!name || !deviceId) return;

    $("connect").disabled = true;
    $("device-err").textContent = "";
    try {
      const status = await callApi("POST", "", { deviceId });
      device = { name, deviceId };
      write(DEVICE_STORAGE, JSON.stringify(device));
      openSwitch(status);
    } catch (error) {
      if (error.status === 401) return askForKey(messageFor(error));
      $("device-err").textContent = messageFor(error);
    } finally {
      $("connect").disabled = false;
    }
  });

  /* ---- the card ---------------------------------------------------------- */

  let state = { online: false, isOn: null };
  let endsAt = null;        // when the relay's own timer switches it off
  let total = 0;            // what the dial drains from
  let ticker = null;

  /** The one place the card is told what is true, and every value here came from the API. */
  function showState(status){
    state = status ? { online: status.online, isOn: status.isOn } : { online: false, isOn: null };

    const left = status && status.isOn === true ? status.timerRemainingSeconds : null;
    if (left > 0){
      // On a reload the device reports what is left, not what it started from, so the dial drains from here.
      startCountdown(left, left);
    } else {
      stopCountdown();
    }
    paint();
  }

  function startCountdown(seconds, from){
    total = Math.max(from, 1);
    endsAt = Date.now() + seconds * 1000;
    if (!ticker) ticker = setInterval(onTick, 250);
  }

  function stopCountdown(){
    clearInterval(ticker);
    ticker = null;
    endsAt = null;
    total = 0;
  }

  function secondsLeft(){
    return endsAt ? Math.max(0, (endsAt - Date.now()) / 1000) : 0;
  }

  function paint(){
    const left = secondsLeft();
    const share = total > 0 ? left / total : 0;
    const on = state.isOn === true;

    $("card").dataset.mode = state.online === false ? "DEAD" : on ? "PLAYING" : "IDLE";
    $("card").classList.toggle("low", endsAt !== null && share <= LOW);

    // A full ring while on without a timer; otherwise it drains with the countdown.
    $("arc").style.strokeDashoffset = String(ARC * (1 - (endsAt ? share : on ? 1 : 0)));
    $("clock").textContent = mmss(endsAt ? left : 0);

    $("toggle").setAttribute("aria-checked", String(on));
    $("word").textContent =
      state.online === false ? "Device offline" :
      state.isOn === null    ? "Status unavailable" :
      on                     ? (endsAt ? "On, running" : "On") : "Off";
  }

  function mmss(seconds){
    const whole = Math.max(0, Math.ceil(seconds - 0.0001));
    return String(Math.floor(whole / 60)).padStart(2, "0") + ":" + String(whole % 60).padStart(2, "0");
  }

  // Counted here rather than polled: Shelly Cloud allows the whole account one request per second.
  function onTick(){
    if (secondsLeft() > 0){
      paint();
      return;
    }

    stopCountdown();
    state.isOn = false;
    paint();
    say("Time is up");
    confirmFromServer();      // the relay switched itself off; ask it what really happened
  }

  /** Whatever a press predicted, the device has the last word. */
  function confirmFromServer(){
    if (!device) return;
    // Waits out the server's own one-per-second gate, so this read follows the command.
    setTimeout(() => {
      callApi("GET", "/" + device.deviceId + "/status")
        .then(showState)
        .catch((error) => { if (error.status === 401) askForKey(messageFor(error)); });
    }, 1300);
  }

  function busy(on){
    $("start").disabled = $("toggle").disabled = on;
  }

  /** Opens the card for the saved device. A fresh status means the first paint is already correct. */
  async function openSwitch(status){
    $("name").textContent = device.name;
    $("device-id").textContent = device.deviceId;
    $("seconds").value = String(Number(read(SECONDS_STORAGE) ?? 60));
    show("switch");

    if (status){
      showState(status);
      say("");
      return;
    }

    say("Connecting…");
    try {
      // The API keeps registered devices in memory, so a restart forgets this one: register again on every load.
      showState(await callApi("POST", "", { deviceId: device.deviceId }));
      say("");
    } catch (error) {
      if (error.status === 401) return askForKey(messageFor(error));
      showState(null);
      say(messageFor(error));
    }
  }

  async function command(path, body, pending, done){
    busy(true);
    say(pending);
    try {
      await callApi("POST", "/" + device.deviceId + path, body);
      say(done);
    } catch (error) {
      if (error.status === 401){ busy(false); return askForKey(messageFor(error)); }
      say(messageFor(error));
    } finally {
      busy(false);
      confirmFromServer();
    }
  }

  $("start").addEventListener("click", () => {
    const seconds = Math.floor(Number($("seconds").value));
    if (!(seconds > 0)){
      say("Give a number of seconds above zero.");
      return;
    }
    write(SECONDS_STORAGE, String(seconds));

    // The relay holds the countdown itself, so the light still goes off with this page closed.
    startCountdown(seconds, seconds);
    state = { online: true, isOn: true };
    paint();
    command("/timer", { seconds }, "Starting…", "Running for " + seconds + "s");
  });

  $("toggle").addEventListener("click", () => {
    const turningOn = state.isOn !== true;
    // Either way the relay drops the timer it was running, so the dial clears.
    stopCountdown();
    state = { online: true, isOn: turningOn };
    paint();
    command(turningOn ? "/on" : "/off", undefined, "Sending…", turningOn ? "Turned on" : "Turned off");
  });

  $("change").addEventListener("click", () => {
    forget(DEVICE_STORAGE);
    device = null;
    stopCountdown();
    $("device-err").textContent = "";
    $("name-input").value = "";
    $("id-input").value = "";
    show("device");
    $("name-input").focus();
  });

  /* ---- start ------------------------------------------------------------- */

  device = savedDevice();
  if (!read(API_KEY_STORAGE)) askForKey();
  else if (!device) show("device");
  else openSwitch();
</script>
</body>
</html>
